upstream backend {
    server backend:3000;
}

upstream ui {
    server ui:80;
}

# gzip cuts JSON payloads ~75% — a typical 50-row Lists response goes
# from ~17 KB to ~3-4 KB. Matters most on slow networks and at the
# 200K-300K-row scale where summary/list responses will grow.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    application/json
    application/javascript
    text/css
    text/plain
    text/xml
    image/svg+xml;

server {
    listen 80;
    server_name localhost;

    # SSE: same upstream as /api/ but with buffering disabled so each
    # `data:` line reaches the browser immediately, and a long read
    # timeout because the connection is idle between events. Declared
    # BEFORE the generic /api/ block so the exact-match wins prefix
    # resolution.
    location = /api/packing/stream {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # API routes - strip /api prefix when forwarding to backend
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api {
        rewrite ^/api$ /api/ permanent;
    }

    # Hashed static assets (Vite emits index-<HASH>.js / .css) are
    # content-addressable — the URL itself changes whenever the file
    # changes, so we can safely cache them forever. immutable tells the
    # browser it doesn't need to revalidate at all.
    location /assets/ {
        proxy_pass http://ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (index.html, /lists, /dashboard, favicon, logo)
    # must NEVER be cached — index.html embeds the hashed asset URLs,
    # and if the browser holds an old copy it keeps pointing at the
    # previous build's asset hashes. no-store + must-revalidate makes
    # sure every navigation checks with the server. This is what fixes
    # the "hard-refresh doesn't pick up new UI" problem.
    location / {
        proxy_pass http://ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
